# CI workflow for Maestro AI

name: CI

on:
	push:
		branches:
		- main

jobs:
	build-and-test:
		name: Build and Test
		 runs-on: ubuntu-latest
		 steps:
		- name: Checkout code
			 uses: actions/checkout@v2
		- name: Install dependencies
			 run: pip install -r requirements.txt
		- name: Run tests
			 run: python -m unittest discover -v